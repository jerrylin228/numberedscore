<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌詞簡譜對齊編輯器 (Jianpu Lyric Aligner)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PptxGenJS CDN: 用於產生原生可編輯、無底色框線的 PowerPoint (.pptx) 投影片 -->
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <!-- Google Fonts: Inter & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --lyric-size: 20px;
            --row-scale: 1.02;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
        }

        /* 高密度單行歌詞列：整句水平排列不隨意斷行 */
        .jianpu-line {
            display: flex;
            flex-wrap: nowrap;
            align-items: flex-end;
            padding: 1px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .jianpu-line:last-child {
            border-bottom: none;
        }

        /* 單一字元垂直堆疊欄 (總高約 58px，確保單一螢幕可顯示 8+ 行) */
        .lyric-cell {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            user-select: none;
            cursor: pointer;
            border-radius: 5px;
            padding: 0 2px;
            min-width: calc(var(--lyric-size) * 1.32);
            transition: background-color 0.1s ease, box-shadow 0.1s ease;
            flex-shrink: 0;
        }

        .lyric-cell:hover {
            background-color: #f8fafc;
            box-shadow: 0 0 0 1px #cbd5e1;
        }

        .lyric-cell.active {
            background-color: #eff6ff;
            box-shadow: 0 0 0 1.5px #2563eb;
            z-index: 5;
        }

        .lyric-cell.space-cell {
            min-width: calc(var(--lyric-size) * 0.72);
        }

        /* 上方簡譜多音子欄群組 */
        .note-subcols-wrap {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 1px;
        }

        /* 單一音符子欄：高八度點(8px) + 數字(20px) + 低八度點(8px) */
        .note-subcol {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            padding: 0 1px;
        }

        .note-subcol.note-selected {
            background-color: #dbeafe;
            color: #1d4ed8;
            box-shadow: inset 0 0 0 1px #93c5fd;
        }

        .note-subcol.note-selected .octave-dot {
            background-color: #1d4ed8;
        }

        /* 1. 高八度點列 (7px) */
        .octave-top {
            height: calc(7px * var(--row-scale));
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 1.5px;
            line-height: 1;
        }

        /* 2. 簡譜數字與升降記號列 (19px) */
        .note-row {
            height: calc(19px * var(--row-scale));
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', Arial, sans-serif;
            font-weight: 700;
            font-size: calc(var(--lyric-size) * 0.85);
            line-height: 1;
            white-space: nowrap;
        }

        .note-subcols-wrap.multi-2 .note-row {
            font-size: calc(var(--lyric-size) * 0.75);
        }
        .note-subcols-wrap.multi-3 .note-row,
        .note-subcols-wrap.multi-4 .note-row {
            font-size: calc(var(--lyric-size) * 0.66);
        }

        .accidental-prefix {
            font-size: 0.68em;
            font-weight: 700;
            line-height: 1;
            margin-right: 0.5px;
            transform: translateY(-0.22em);
            display: inline-block;
        }

        /* 3. 低八度點列 (7px) */
        .octave-bottom {
            height: calc(7px * var(--row-scale));
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 1.5px;
            line-height: 1;
        }

        .octave-dot {
            width: 3.5px;
            height: 3.5px;
            background-color: #0f172a;
            border-radius: 9999px;
            display: inline-block;
        }

        /* 4. 歌詞字元列 (21px) */
        .lyric-row {
            height: calc(21px * var(--row-scale));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--lyric-size);
            line-height: 1;
            font-weight: 400;
            color: #0f172a;
            white-space: pre;
        }

        /* 隱藏頁籤列預設捲軸 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 美化主區捲軸 */
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- ==================== 1. 頂部標題 + 歌曲頁籤 + 全曲操作 (單一緊湊列，最高 44px) ==================== -->
    <header class="bg-white border-b border-slate-200 px-3 h-[42px] max-h-[44px] flex items-center justify-between gap-2 z-20 shrink-0">
        <!-- 左側：品牌標題 -->
        <div class="flex items-center gap-2 shrink-0">
            <div class="w-6 h-6 rounded-md bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-2xs">
                簡
            </div>
            <h1 class="text-sm font-bold text-slate-800 whitespace-nowrap tracking-tight">歌詞簡譜對齊編輯器</h1>
        </div>

        <!-- 中間：多歌曲頁籤列 (水平捲動不擠壓右側按鈕) -->
        <nav class="flex-1 min-w-0 flex items-center gap-1 overflow-x-auto no-scrollbar px-1" id="songTabsBar" aria-label="歌曲頁籤列">
            <!-- 動態生成歌曲頁籤 -->
        </nav>

        <!-- 右側：全曲匯出與 JSON 備份 (shrink-0 確保絕不裁切) -->
        <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="exportToPPTX(null)" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-2.5 py-1 rounded-lg shadow-2xs transition active:scale-95 whitespace-nowrap shrink-0" title="將整首歌匯出為原生可編輯 PowerPoint 簡報（1 頁 = 1 張投影片）">
                <span>匯出整首 PPTX</span>
            </button>
            <button onclick="exportAllSongsJSON()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-2 py-1 rounded-lg transition whitespace-nowrap shrink-0" title="匯出全部歌曲備份 (.json)">
                匯出備份
            </button>
            <label class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-2 py-1 rounded-lg transition whitespace-nowrap shrink-0 cursor-pointer" title="匯入歌曲備份 (.json)">
                匯入備份
                <input type="file" id="jsonFileInput" accept=".json" class="hidden" onchange="importAllSongsJSON(event)">
            </label>
        </div>
    </header>

    <!-- ==================== 2. 固定簡譜編輯工具列 (單一緊湊列，含上/下一步與可鎖定記號按鈕) ==================== -->
    <div class="bg-slate-50 border-b border-slate-200 px-3 h-[42px] max-h-[44px] flex items-center justify-between gap-2 z-10 shrink-0 overflow-x-auto no-scrollbar whitespace-nowrap">
        <div class="flex items-center gap-1 shrink-0">
            <!-- 上一步 / 下一步 -->
            <button id="undoBtn" onclick="undoAction()" disabled class="px-2 h-6 rounded bg-white hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none border border-slate-300 text-slate-700 text-xs font-medium transition" title="復原上一步 (Ctrl+Z / Cmd+Z)">↩ 上一步</button>
            <button id="redoBtn" onclick="redoAction()" disabled class="px-2 h-6 rounded bg-white hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none border border-slate-300 text-slate-700 text-xs font-medium transition" title="重做下一步 (Ctrl+Y / Ctrl+Shift+Z)">↪ 下一步</button>

            <div class="h-4 w-px bg-slate-300 mx-0.5"></div>

            <!-- 模式切換 -->
            <div class="flex items-center bg-slate-200/80 p-0.5 rounded-md border border-slate-300/70">
                <button id="modeOverwriteBtn" onclick="setInputMode('overwrite')" class="px-2 py-0.5 text-xs font-semibold rounded bg-white text-blue-600 shadow-2xs transition">
                    單音覆蓋
                </button>
                <button id="modeAppendBtn" onclick="setInputMode('append')" class="px-2 py-0.5 text-xs font-semibold rounded text-slate-600 hover:text-slate-900 transition">
                    多音連加 (+音)
                </button>
            </div>

            <div class="h-4 w-px bg-slate-300 mx-0.5"></div>

            <!-- 簡譜數字快速鍵 + 新增同字音符 + 刪除 -->
            <button onclick="inputNoteDigit('1')" class="w-6 h-6 rounded bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-400 border border-slate-300 font-mono font-bold text-xs transition">1</button>
            <button onclick="inputNoteDigit('2')" class="w-6 h-6 rounded bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-400 border border-slate-300 font-mono font-bold text-xs transition">2</button>
            <button onclick="inputNoteDigit('3')" class="w-6 h-6 rounded bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-400 border border-slate-300 font-mono font-bold text-xs transition">3</button>
            <button onclick="inputNoteDigit('4')" class="w-6 h-6 rounded bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-400 border border-slate-300 font-mono font-bold text-xs transition">4</button>
            <button onclick="inputNoteDigit('5')" class="w-6 h-6 rounded bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-400 border border-slate-300 font-mono font-bold text-xs transition">5</button>
            <button onclick="inputNoteDigit('6')" class="w-6 h-6 rounded bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-400 border border-slate-300 font-mono font-bold text-xs transition">6</button>
            <button onclick="inputNoteDigit('7')" class="w-6 h-6 rounded bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-400 border border-slate-300 font-mono font-bold text-xs transition">7</button>
            <button onclick="inputNoteDigit('0')" class="w-6 h-6 rounded bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-400 border border-slate-300 font-mono font-bold text-xs transition" title="休止符 0">0</button>
            <button onclick="inputNoteDigit('-')" class="w-6 h-6 rounded bg-white hover:bg-blue-50 hover:text-blue-600 hover:border-blue-400 border border-slate-300 font-mono font-bold text-xs transition" title="延音線 -">-</button>
            <button onclick="addExtraNoteSlot()" class="px-1.5 h-6 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-semibold transition" title="為目前歌詞新增同字音符 (+)">+音</button>
            <button onclick="clearSelectedNote()" class="px-2 h-6 rounded bg-rose-50 hover:bg-rose-100 border border-rose-200 text-xs text-rose-600 font-semibold transition" title="刪除目前音符 (Backspace / Delete)">刪除</button>

            <div class="h-4 w-px bg-slate-300 mx-0.5"></div>

            <!-- 可保持開啟/關閉的八度切換群組 -->
            <div class="flex items-center gap-1" role="group" aria-label="八度鎖定切換">
                <button id="octHighBtn" onclick="toggleStickyOctave(1)" class="px-2 h-6 rounded border text-xs font-medium transition" title="開啟/關閉高八度鎖定 (快捷鍵: Q)">高八度 •</button>
                <button id="octMidBtn" onclick="setStickyOctave(0)" class="px-2 h-6 rounded border text-xs font-medium transition" title="切換為中音 (快捷鍵: W)">中音</button>
                <button id="octLowBtn" onclick="toggleStickyOctave(-1)" class="px-2 h-6 rounded border text-xs font-medium transition" title="開啟/關閉低八度鎖定 (快捷鍵: A)">低八度 •</button>
            </div>

            <div class="h-4 w-px bg-slate-300 mx-0.5"></div>

            <!-- 可保持開啟/關閉的升降還原記號群組 -->
            <div class="flex items-center gap-1" role="group" aria-label="升降還原鎖定切換">
                <button id="accSharpBtn" onclick="toggleStickyAccidental('♯')" class="px-1.5 h-6 rounded border font-semibold text-xs transition" title="開啟/關閉升記號鎖定 (快捷鍵: #)">♯ 升</button>
                <button id="accFlatBtn" onclick="toggleStickyAccidental('♭')" class="px-1.5 h-6 rounded border font-semibold text-xs transition" title="開啟/關閉降記號鎖定 (快捷鍵: b)">♭ 降</button>
                <button id="accNaturalBtn" onclick="toggleStickyAccidental('♮')" class="px-1.5 h-6 rounded border font-semibold text-xs transition" title="開啟/關閉還原記號鎖定 (快捷鍵: n)">♮ 還原</button>
                <button id="accClearBtn" onclick="clearStickyAccidental()" class="px-1.5 h-6 rounded bg-white hover:bg-slate-200 border border-slate-300 text-xs text-slate-600 transition" title="關閉記號鎖定並清除目前音符記號">清除記號</button>
            </div>

            <!-- 即時預設記號狀態指示標籤 -->
            <span id="stickyModifierPill" class="ml-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-slate-200/80 text-slate-600 border border-slate-300/70">
                預設記號：中音
            </span>
        </div>

        <!-- 右側顯示與匯出設定 -->
        <div class="flex items-center gap-2.5 shrink-0 text-xs text-slate-600">
            <label class="flex items-center gap-1 cursor-pointer select-none" title="勾選後，複製或下載的 PNG 圖片為透明背景">
                <input type="checkbox" id="transparentBgCheckbox" checked class="accent-emerald-600 rounded cursor-pointer">
                <span class="font-medium text-slate-700">透明圖底</span>
            </label>
            <div class="flex items-center gap-1" title="調整歌詞與簡譜顯示字級 (16px–28px)">
                <span>字級</span>
                <input type="range" id="fontSizeSlider" min="16" max="28" value="20" oninput="updateFontSize()" class="w-16 accent-blue-600 cursor-pointer">
                <span id="fontSizeLabel" class="font-mono w-8 text-slate-700 font-medium">20px</span>
            </div>
        </div>
    </div>

    <!-- ==================== 3. 高密度多頁面簡譜工作區 ==================== -->
    <main class="flex-1 overflow-y-auto px-3 py-2.5 flex flex-col items-center gap-3" id="pagesWorkspace">
        <!-- 動態渲染各段落頁面卡片 -->
    </main>

    <!-- ==================== 4. 精簡底部狀態列 ==================== -->
    <footer class="bg-white border-t border-slate-200 px-3 py-1 text-[11px] text-slate-500 flex items-center justify-between gap-2 shrink-0">
        <div id="statusSelectionInfo" class="flex items-center gap-1.5 truncate">
            <span class="inline-block w-2 h-2 rounded-full bg-blue-500"></span>
            <span>點擊任一歌詞開始標註，方向鍵 ← → 移動</span>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <span class="hidden lg:inline text-slate-400">
                快捷鍵：音符 <kbd class="px-1 bg-slate-100 border rounded text-slate-600">1-7/0/-</kbd> ・ 八度鎖定 <kbd class="px-1 bg-slate-100 border rounded text-slate-600">Q/W/A</kbd> ・ 記號鎖定 <kbd class="px-1 bg-slate-100 border rounded text-slate-600">#/b/n</kbd> ・ 復原 <kbd class="px-1 bg-slate-100 border rounded text-slate-600">Ctrl+Z/Y</kbd>
            </span>
            <button id="autoMoveIndicator" class="cursor-pointer hover:text-blue-600 select-none font-medium text-slate-600" onclick="toggleAutoAdvance()">
                ☑ 自動跳下一字
            </button>
        </div>
    </footer>

    <!-- ==================== 5. 貼上/編輯歌詞 Modal ==================== -->
    <div id="lyricsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-xl overflow-hidden flex flex-col">
            <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <h3 class="font-bold text-slate-800 text-sm" id="lyricsModalTitle">貼上/編輯本頁歌詞</h3>
                <button onclick="closeLyricsModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="p-4 space-y-2.5">
                <p class="text-xs text-slate-500">
                    請貼上或編輯此頁的歌詞（每行代表一列簡譜）。空白會自動保留為間隔，標點符號在自動跳字時會智慧略過。
                </p>
                <textarea id="modalLyricsTextarea" rows="9" class="w-full p-3 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none leading-relaxed font-sans" placeholder="請貼上這一段的歌詞，例如：&#10;故事的小黃花 從出生那年就飄著&#10;童年的盪鞦韆 隨記憶一直晃到現在"></textarea>
            </div>
            <div class="px-4 py-3 border-t border-slate-100 bg-slate-50 flex flex-wrap items-center justify-end gap-2">
                <button onclick="closeLyricsModal()" class="px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition">取消</button>
                <button onclick="applyModalLyrics(true)" class="px-3 py-1.5 text-xs font-semibold bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-lg transition">
                    智慧保留原簡譜並更新
                </button>
                <button onclick="applyModalLyrics(false)" class="px-3 py-1.5 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-2xs transition">
                    套用全新歌詞 (清空簡譜)
                </button>
            </div>
        </div>
    </div>

    <!-- ==================== 6. 自訂確認對話框 Modal ==================== -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm overflow-hidden p-4 space-y-3">
            <h3 class="font-bold text-slate-800 text-sm" id="confirmModalTitle">確認操作</h3>
            <p class="text-xs text-slate-600 leading-relaxed" id="confirmModalMessage">確定要執行此操作嗎？</p>
            <div class="flex justify-end gap-2 pt-1">
                <button onclick="closeConfirmModal()" class="px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">取消</button>
                <button id="confirmModalOkBtn" class="px-3 py-1.5 text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white rounded-lg shadow-2xs transition">確定執行</button>
            </div>
        </div>
    </div>

    <!-- ==================== 6.5 自訂名稱輸入對話框 Modal ==================== -->
    <div id="promptModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm overflow-hidden p-4 space-y-3">
            <h3 class="font-bold text-slate-800 text-sm" id="promptModalTitle">修改名稱</h3>
            <input type="text" id="promptModalInput" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="請輸入名稱">
            <div class="flex justify-end gap-2 pt-1">
                <button onclick="closePromptModal()" class="px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">取消</button>
                <button id="promptModalOkBtn" class="px-3 py-1.5 text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-2xs transition">儲存</button>
            </div>
        </div>
    </div>

    <!-- ==================== 7. 浮動提示訊息容器 ==================== -->
    <div id="toastContainer" class="fixed bottom-9 right-4 z-50 flex flex-col gap-1.5 max-w-md pointer-events-none"></div>

    <!-- 離屏高解析度 Canvas (圖片匯出專用) -->
    <canvas id="exportCanvas" class="hidden"></canvas>

    <script>
        // =========================================================================
        // 核心狀態與預載 8 行完整範例資料《晴天 (範例)》
        // =========================================================================
        const STORAGE_KEY = 'jianpu_lyric_aligner_v5';
        const MAX_HISTORY = 60;

        let appState = {
            activeSongId: '',
            songs: []
        };

        let selectedPos = { pageIdx: 0, lineIdx: 0, tokenIdx: 0, noteIdx: 0 };
        let inputMode = 'overwrite'; // 'overwrite' | 'append'
        let autoAdvance = true;
        let editingModalPageIdx = 0;

        // 可保持開啟/關閉的八度與升降還原鎖定狀態
        let activeOctave = 0;       // 0 (中音), 1 (高八度 •), -1 (低八度 •)
        let activeAccidental = '';  // '' (無), '♯', '♭', '♮'

        // 上一步 / 下一步歷史堆疊
        let undoStack = [];
        let redoStack = [];

        const PUNCTUATION_REGEX = /^[，。、！？；：「」『』（）(),.!?;:~—…]+$/;

        /**
         * 輔助函式：將精簡譜面定義陣列轉為標準 Token 物件列
         * 格式：[歌詞字元, [[音高, 八度, 升降記號], ...]]
         */
        function buildTokensFromCompactSpec(specList) {
            return specList.map(([char, noteSpecs]) => {
                if (char === ' ' && (!noteSpecs || noteSpecs.length === 0)) {
                    return { lyric: ' ', isSpace: true, notes: [] };
                }
                const notes = (noteSpecs || []).map(([pitch, octave = 0, accidental = '']) => ({
                    pitch: String(pitch),
                    octave,
                    accidental
                }));
                return { lyric: char, isSpace: false, notes };
            });
        }

        /**
         * 建立預設歌曲《晴天 (範例)》：
         * 第 1 頁完整預載 8 行主歌，開啟即可在單一畫面同時檢視 8 行歌詞與簡譜！

        function createSampleSong() {
            const page1Lines = [

                buildTokensFromCompactSpec([

                    ['飄', [['6', 0], ['5', 0]]], ['著', [['2', 0]]]

                buildTokensFromCompactSpec([

                ]),
                // 第 3 行：吹著前奏望著天空 我想起花瓣試著掉落
                buildTokensFromCompactSpec([
                    ['吹', [['2', 0]]], ['著', [['5', 0]]], ['前', [['5', 0]]], ['奏', [['7', 0]]], ['望', [['1', 1]]], ['著', [['7', 0]]], ['天', [['6', 0]]], ['空', [['5', 0]]],
                    [' ', []],
                    ['我', [['6', 0]]], ['想', [['7', 0]]], ['起', [['7', 0]]], ['花', [['7', 0]]], ['瓣', [['7', 0]]], ['試', [['6', 0]]], ['著', [['7', 0]]], ['掉', [['6', 0]]], ['落', [['5', 0]]]
                ]),
                // 第 4 行：為妳翹課的那一天 花落的那一天
                buildTokensFromCompactSpec([
                    ['為', [['4', 0, '♯']]], ['妳', [['5', 0]]], ['翹', [['5', 0]]], ['課', [['5', 0]]], ['的', [['5', 0]]], ['那', [['4', 0, '♯']]], ['一', [['5', 0]]], ['天', [['5', 0]]],
                    [' ', []],
                    ['花', [['5', 0]]], ['落', [['5', 0]]], ['的', [['5', 0]]], ['那', [['4', 0, '♯']]], ['一', [['5', 0]]], ['天', [['5', 0]]]
                ]),
                // 第 5 行：教室的那一間 我怎麼看不見
                buildTokensFromCompactSpec([
                    ['教', [['5', 0]]], ['室', [['5', 0]]], ['的', [['5', 0]]], ['那', [['4', 0]]], ['一', [['5', 0]]], ['間', [['5', 0]]],
                    [' ', []],
                    ['我', [['5', 0]]], ['怎', [['5', 0]]], ['麼', [['5', 0]]], ['看', [['2', 1]]], ['不', [['2', 1]]], ['見', [['2', 1]]]
                ]),
                // 第 6 行：消失的下雨天 我好想再淋一遍
                buildTokensFromCompactSpec([
                    ['消', [['2', 1]]], ['失', [['2', 1]]], ['的', [['2', 1]]], ['下', [['2', 1]]], ['雨', [['2', 1]]], ['天', [['2', 1]]],
                    [' ', []],
                    ['我', [['2', 1]]], ['好', [['2', 1]]], ['想', [['2', 1]]], ['再', [['2', 1]]], ['淋', [['1', 1]]], ['一', [['1', 1]]], ['遍', [['7', 0]]]
                ]),
                // 第 7 行：沒想到失去的勇氣我還留著
                buildTokensFromCompactSpec([
                    ['沒', [['6', 0]]], ['想', [['5', 0]]], ['到', [['4', 0, '♯']]], ['失', [['5', 0]]], ['去', [['3', 0]]], ['的', [['4', 0, '♯']]],
                    ['勇', [['5', 0]]], ['氣', [['2', 1]]], ['我', [['1', 1]]], ['還', [['7', 0]]], ['留', [['5', 0]]], ['著', [['5', 0]]]
                ]),
                // 第 8 行：好想再問一遍 妳會等待還是離開
                buildTokensFromCompactSpec([
                    ['好', [['3', 0]]], ['想', [['5', 0]]], ['再', [['5', 0]]], ['問', [['5', 0]]], ['一', [['7', 0]]], ['遍', [['5', 0]]],
                    [' ', []],
                    ['妳', [['3', 0]]], ['會', [['4', 0, '♯']]], ['等', [['5', 0]]], ['待', [['2', 1]]], ['還', [['1', 1]]], ['是', [['7', 0]]], ['離', [['5', 0]]], ['開', [['6', 0]]]
                ])

            const page2Lines = [
                buildTokensFromCompactSpec([
                    ['颳', [['7', 0]]], ['風', [['6', 0]]], ['這', [['1', 1]]], ['天', [['7', 0]]],
                    [' ', []],
                    ['我', [['5', 0]]], ['試', [['2', 1]]], ['過', [['4', 0, '♯']]], ['握', [['5', 0]]], ['著', [['4', 0, '♯']]], ['妳', [['2', 1]]], ['手', [['5', 0]]]
                ]),
                buildTokensFromCompactSpec([
                    ['但', [['5', 0]]], ['偏', [['3', 1]]], ['偏', [['3', 1]]],
                    [' ', []],
                    ['雨', [['3', 1]]], ['漸', [['2', 1]]], ['漸', [['2', 1]]],
                    [' ', []],
                    ['大', [['2', 1]]], ['到', [['1', 1]]], ['我', [['7', 0]]], ['看', [['6', 0]]], ['妳', [['7', 0]]], ['不', [['1', 1]]], ['見', [['7', 0]]]
                ]),
                buildTokensFromCompactSpec([
                    ['還', [['7', 0]]], ['要', [['1', 1]]], ['多', [['2', 1]]], ['久', [['7', 0]]],
                    [' ', []],
                    ['我', [['1', 1]]], ['才', [['2', 1]]], ['能', [['4', 0, '♯']]], ['在', [['6', 0]]], ['妳', [['4', 0, '♯']]], ['身', [['5', 0]]], ['邊', [['5', 0]]]
                ]),
                buildTokensFromCompactSpec([
                    ['等', [['5', 0]]], ['到', [['5', 0]]], ['放', [['2', 1]]], ['晴', [['2', 1]]], ['的', [['3', 1]]], ['那', [['2', 1]]], ['天', [['1', 1]]],
                    [' ', []],
                    ['也', [['6', 0]]], ['許', [['7', 0]]], ['我', [['1', 1]]], ['會', [['2', 1]]], ['比', [['3', 1]]], ['較', [['5', 0]]], ['好', [['3', 1]]], ['一', [['4', 0, '♯']]], ['點', [['4', 0, '♯']]]
                ])

            return {
                id: 'song_sample_sunny_v5',
                title: '晴天 (範例)',
                pages: [
                    { id: 'page_sample_1', title: '主歌 A', lines: page1Lines },
                    { id: 'page_sample_2', title: '副歌', lines: page2Lines }
